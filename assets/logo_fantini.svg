<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <style>
      .cls-white { fill: #ffffff; }
      .cls-gray { fill: #8a8a8a; }
      .cls-text-bold { font-family: 'Outfit', 'Inter', 'Montserrat', sans-serif; font-weight: 800; font-size: 78px; fill: #ffffff; text-anchor: middle; letter-spacing: -0.02em; }
      .cls-text-sub { font-family: 'Inter', 'Montserrat', sans-serif; font-weight: 300; font-size: 18px; fill: #ffffff; text-anchor: middle; letter-spacing: 0.42em; opacity: 0.9; }
    </style>
  </defs>

  <!-- BACKGROUND (Suttle black for visual preview, can be transparent when embedded) -->
  <rect width="100%" height="100%" fill="none" />

  <!-- ICON GROUP -->
  <g transform="translate(0, -10)">
    <!-- 4-Point Star (Sparkle) in Solid Gray -->
    <!-- Positioned precisely at the top-left of the F icon -->
    <path class="cls-gray" d="M 342,108 C 342,93 338,82 324,82 C 338,82 342,71 342,56 C 342,71 346,82 360,82 C 346,82 342,93 342,108 Z" />

    <!-- Stylized Geometrical "F" Icon in Pure White -->
    <!-- Features clean slanted cuts, heavy horizontal weights, and sharp precision angles -->
    <path class="cls-white" d="M 353,52 L 442,52 L 434,81 L 379,81 L 375,99 L 416,99 L 409,128 L 367,128 L 354,172 L 321,172 L 353,52 Z" />
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <!-- "Fantini" - Bold, Modern, High Contrast -->
  <text x="400" y="278" class="cls-text-bold">Fantini</text>
  
  <!-- "ENGENHARIA E TECNOLOGIA" - Light, Elegant, Wide Letter-Spacing -->
  <text x="404" y="328" class="cls-text-sub">ENGENHARIA E TECNOLOGIA</text>
</svg>
